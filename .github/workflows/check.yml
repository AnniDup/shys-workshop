name: Check

on:
  # Every push to dev
  push:
    branches: [dev]
  # Every pull request into main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, check and build
        uses: withastro/action@v6
